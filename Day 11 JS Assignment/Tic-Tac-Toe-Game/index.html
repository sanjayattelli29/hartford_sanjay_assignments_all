<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-purple-400 via-pink-500 to-red-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Tic-Tac-Toe</h1>
            <p class="text-gray-600" id="turnInfo">Player X's Turn</p>
        </div>
        <div class="grid grid-cols-3 gap-3 mb-6" id="gameBoard">
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="0"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="1"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="2"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="3"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="4"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="5"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="6"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="7"></button>
            <button class="cell aspect-square bg-gray-100 hover:bg-gray-200 rounded-lg text-5xl font-bold text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300" data-index="8"></button>
        </div>
        <div class="text-center mb-6">
            <p id="gameStatus" class="text-xl font-semibold text-gray-700 min-h-[28px]"></p>
        </div>
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-blue-100 rounded-lg p-3 text-center">
                <p class="text-sm text-gray-600 mb-1">Player X</p>
                <p class="text-2xl font-bold text-blue-600" id="scoreX">0</p>
            </div>
            <div class="bg-gray-100 rounded-lg p-3 text-center">
                <p class="text-sm text-gray-600 mb-1">Draws</p>
                <p class="text-2xl font-bold text-gray-600" id="scoreDraw">0</p>
            </div>
            <div class="bg-red-100 rounded-lg p-3 text-center">
                <p class="text-sm text-gray-600 mb-1">Player O</p>
                <p class="text-2xl font-bold text-red-600" id="scoreO">0</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button id="restartBtn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-4 focus:ring-purple-300">
                New Game
            </button>
            <button id="resetScoreBtn" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-4 focus:ring-gray-300">
                Reset Score
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
