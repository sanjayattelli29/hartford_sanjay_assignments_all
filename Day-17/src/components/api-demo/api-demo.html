<div class="card">
    <h2 class="section-title">API Data Fetching Demo</h2>
    <p>Fetching data from: <a href="https://jsonplaceholder.typicode.com/posts"
            target="_blank">https://jsonplaceholder.typicode.com/posts</a></p>

    <div *ngIf="loading()" style="text-align: center; padding: 20px;">
        <p>Loading posts...</p>
    </div>

    <div *ngIf="error()" class="error" style="text-align: center; padding: 20px;">
        {{ error() }}
    </div>

    <div *ngIf="!loading() && !error()">
        <table class="styled-table">
            <thead>
                <tr>
                    <th style="width: 50px;">ID</th>
                    <th style="width: 250px; color: var(--secondary-color);">Title</th>
                    <th>Body</th>
                    <th style="width: 150px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let post of posts() | slice:0:10">
                    <td>{{ post.id }}</td>
                    <td style="font-weight: bold; color: var(--secondary-color);">{{ post.title | titlecase }}</td>
                    <td>{{ post.body }}</td>
                    <td>
                        <button class="btn-edit" (click)="editPost(post)">Edit</button>
                        <button class="btn-delete" (click)="deletePost(post.id)">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
