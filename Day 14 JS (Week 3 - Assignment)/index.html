<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Banking Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1><i class="fas fa-university"></i> Online Banking Dashboard</h1>
        </div>
    </header>

    <div class="container main-content">

        <section class="controls-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by Account Holder Name...">
                <i class="fas fa-search"></i>
            </div>

            <div class="filter-box">
                <select id="branchFilter">
                    <option value="">All Branches</option>
                </select>
            </div>

            <button id="sortBtn" class="btn btn-secondary"><i class="fas fa-sort-amount-down"></i> Sort by
                Balance</button>
        </section>

        <section class="stats-section">
            <div class="stat-card">
                <h3>Total Bank Balance</h3>
                <p id="totalBalanceDisplay">₹ 0</p>
            </div>
        </section>

        <section class="create-account-section">
            <h2><i class="fas fa-user-plus"></i> Open New Account</h2>
            <form id="createAccountForm">
                <div class="form-group">
                    <input type="text" id="newName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="newEmail" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="text" id="newBranch" placeholder="Branch (City)" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
        </section>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Loading accounts...</p>
        </div>
        <div id="errorMessage" class="error-msg hidden"></div>

        <section class="accounts-section">
            <h2>Accounts Overview</h2>
            <div id="accountsGrid" class="grid-container">
            </div>
        </section>

    </div>

    <div id="transactionModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modalTitle">Perform Transaction</h2>
            <p id="modalAccountName">Account: -</p>
            <div class="form-group">
                <input type="number" id="transactionAmount" placeholder="Enter Amount" min="1">
            </div>
            <div class="modal-actions">
                <button id="depositBtn" class="btn btn-success">Deposit</button>
                <button id="withdrawBtn" class="btn btn-danger">Withdraw</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal-history">&times;</span>
            <h2>Transaction History</h2>
            <p id="historyAccountName">Account: -</p>
            <ul id="transactionList" class="history-list">
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
