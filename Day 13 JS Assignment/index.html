<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CRUD Operations</title>
</head>

<body>
    <h2>1️.Fetch operation</h2>
    <button onclick="getProducts()">Fetch Products</button>
    <br><br>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="productBody"></tbody>
    </table>
    <hr>
    <h2>2️.Add operation</h2>
    <form onsubmit="addProduct(event)">
        <label>Title:</label>
        <input type="text" id="title" required><br><br>
        <label>Price:</label>
        <input type="number" id="price" required><br><br>
        <button type="submit">Add Product</button>
    </form>
    <hr>
    <h2>3️.Update operation</h2>
    <form onsubmit="updateProduct(event)">
        <label>ID:</label>
        <input type="number" id="updateId" required><br><br>
        <label>New Price:</label>
        <input type="number" id="updatePrice" required><br><br>
        <button type="submit">Update Product</button>
    </form>
    <hr>
    <h2>4️.Delete operation</h2>
    <form onsubmit="deleteProduct(event)">
        <label>ID:</label>
        <input type="number" id="deleteId" required><br><br>

        <button type="submit">Delete Product</button>
    </form>
    <script src="script.js"></script>
</body>

</html>
