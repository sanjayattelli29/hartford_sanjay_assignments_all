<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-purple-600 p-4">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
            <p class="text-gray-600">Please sign in to your account</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
            @if (errorMessage()) {
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                <span class="block sm:inline">{{ errorMessage() }}</span>
            </div>
            }

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>
                <input type="email" id="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="Enter your email"
                />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>
                <input type="password" id="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    placeholder="Enter your password" />
            </div>

            <button type="submit" [disabled]="isLoading()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isLoading()) {
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Don't have an account?
                <a routerLink="/register" class="text-blue-600 hover:text-blue-800 font-semibold ml-1">
          Sign up
        </a>
            </p>
        </div>

        <div class="mt-4 p-4 bg-gray-100 rounded-lg">
            <p class="text-xs text-gray-600 mb-2">Demo credentials:</p>
            <p class="text-xs text-gray-700">Email: admin@example.com</p>
            <p class="text-xs text-gray-700">Password: admin123</p>
        </div>
    </div>
</div>
