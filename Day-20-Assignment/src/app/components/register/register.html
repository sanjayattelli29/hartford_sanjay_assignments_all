<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-500 to-teal-600 p-4">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h1>
            <p class="text-gray-600">Sign up to get started</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
            @if (errorMessage()) {
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                <span class="block sm:inline">{{ errorMessage() }}</span>
            </div>
            }

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
          Full Name
        </label>
                <input type="text" id="name" [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition" placeholder="Enter your full name"
                />
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>
                <input type="email" id="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                    placeholder="Enter your email" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>
                <input type="password" id="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                    placeholder="Enter your password" />
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Confirm Password
        </label>
                <input type="password" id="confirmPassword" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" name="confirmPassword" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
                    placeholder="Confirm your password" />
            </div>

            <button type="submit" [disabled]="isLoading()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isLoading()) {
          <span>Creating account...</span>
        } @else {
          <span>Sign Up</span>
        }
      </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Already have an account?
                <a routerLink="/login" class="text-green-600 hover:text-green-800 font-semibold ml-1">
          Sign in
        </a>
            </p>
        </div>
    </div>
</div>
